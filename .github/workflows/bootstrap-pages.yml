name: Bootstrap Bitacora Mobile PWA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitacora-mobile-bootstrap
  cancel-in-progress: true

env:
  ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-3f20-81f7-91ac-428b7fd74d8e/raw?se=2026-08-14T08%3A02%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=8a1bfef1-034d-5cd2-8129-4a535898f8ff&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T19%3A48%3A59Z&ske=2026-08-14T19%3A48%3A59Z&sks=b&skv=2026-02-06&sig=8d2m%2B4Rs8zbvm79UUb7q47iYEqKCKiFI1BoWTi3oAtI%3D'
  ARTIFACT_SHA256: '5869eb536458dcd9548ae4f9fcaeef1935b6b67d57f8fceaf20fd657e71c9e21'

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v5

      - name: Download and verify sanitized artifact
        run: |
          curl --fail --location --retry 4 --retry-all-errors "$ARTIFACT_URL" --output /tmp/bitacora-site.zip
          echo "$ARTIFACT_SHA256  /tmp/bitacora-site.zip" | sha256sum --check -
          rm -rf /tmp/bitacora-site
          mkdir -p /tmp/bitacora-site
          unzip -q /tmp/bitacora-site.zip -d /tmp/bitacora-site
          test -f /tmp/bitacora-site/index.html
          test -f /tmp/bitacora-site/manifest.webmanifest
          test -f /tmp/bitacora-site/src/data.js
          grep -q 'runtimeMode: "public-preview"' /tmp/bitacora-site/src/data.js
          grep -q 'src/quick-capture-ui.js' /tmp/bitacora-site/sw.js

      - name: Add final install icons and phone metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert --width 192 --height 192 /tmp/bitacora-site/icons/icon.svg --output /tmp/bitacora-site/icons/icon-192.png
          rsvg-convert --width 512 --height 512 /tmp/bitacora-site/icons/icon.svg --output /tmp/bitacora-site/icons/icon-512.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/bitacora-site')
          manifest_path = root / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src': 'icons/icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': 'icons/icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any maskable'},
              {'src': 'icons/icon.svg', 'sizes': 'any', 'type': 'image/svg+xml', 'purpose': 'any'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for name in ('index.html', '404.html'):
              path = root / name
              text = path.read_text(encoding='utf-8')
              marker = '    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />\n'
              addition = marker + '    <link rel="apple-touch-icon" href="./icons/icon-192.png" />\n'
              if 'apple-touch-icon' not in text:
                  text = text.replace(marker, addition)
              path.write_text(text, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('const CACHE_NAME = "bitacora-u1-v5";', 'const CACHE_NAME = "bitacora-mobile-v1";')
          sw = sw.replace(
              '  "./icons/icon.svg"\n',
              '  "./icons/icon.svg",\n  "./icons/icon-192.png",\n  "./icons/icon-512.png"\n'
          )
          sw_path.write_text(sw, encoding='utf-8')
          (root / '.nojekyll').touch()
          PY

      - name: Validate final public tree
        run: |
          test -f /tmp/bitacora-site/.nojekyll
          test -f /tmp/bitacora-site/404.html
          test -f /tmp/bitacora-site/icons/icon-192.png
          test -f /tmp/bitacora-site/icons/icon-512.png
          grep -q '"display": "standalone"' /tmp/bitacora-site/manifest.webmanifest
          grep -q '"start_url": "./"' /tmp/bitacora-site/manifest.webmanifest
          grep -q 'icon-512.png' /tmp/bitacora-site/manifest.webmanifest
          grep -q 'bitacora-mobile-v1' /tmp/bitacora-site/sw.js
          ! grep -R -q 'Oshkosh, Wisconsin' /tmp/bitacora-site
          ! grep -R -q 'Gerente general de un restaurante' /tmp/bitacora-site
          ! find /tmp/bitacora-site -type f \( -name '*.apk' -o -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \) | grep -q .

      - name: Replace bootstrap payload with deployable site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/bitacora-site/. .
          cat > README.md <<'EOF'
          # Bitácora Mobile

          Distribución pública sanitizada de la PWA **Bitácora — Don Orlando López**.

          - El código público contiene únicamente el shell y datos de demostración.
          - Los datos que el usuario capture permanecen en el navegador del teléfono.
          - Funciona offline después de la primera carga.
          - Incluye IndexedDB, captura rápida, calendario `.ics` y respaldo/restauración JSON.
          - No contiene secretos, credenciales, IDs productivos ni documentos privados.

          Esta distribución se publica sin Vercel, Replit, Supabase ni gastos de hosting.
          EOF
          git config user.name "Bitacora Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publish sanitized Bitacora mobile PWA"
          git push origin HEAD:main
